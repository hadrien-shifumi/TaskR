; Production php settings for taskr (FrankenPHP worker mode)
[php]
memory_limit = 256M
expose_php = Off
max_execution_time = 30
upload_max_filesize = 20M
post_max_size = 20M
variables_order = "EGPCS"

[opcache]
opcache.enable = 1
opcache.enable_cli = 1
; The app is fully in the image, so we can cache everything aggressively.
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
; Validate timestamps only once — code changes only via new containers.
opcache.revalidate_freq = 0
opcache.validate_timestamps = 0
; No opcache.preload: the bare Composer autoloader preloads no application
; class, and with opcache.enable_cli it ran in every PHP process — each
; artisan call paid for it and warned ("Can't preload unlinked class") about
; the framework's anonymous classes. Workers are long-lived anyway: what they
; load stays loaded.
