services:
  app:
    # Published multi-arch image (GHCR), built by CI on every v* tag. Pin a
    # version by setting TASKR_VERSION in .env (defaults to latest).
    image: ghcr.io/hadrien-shifumi/taskr:${TASKR_VERSION:-latest}
    # Prefer the published image: `docker compose up` pulls it. Force a local
    # prod-like build with `docker compose up --build`.
    pull_policy: always
    build:
      context: .
    container_name: taskr-app
    ports:
      - "8080:8080"
    env_file: .env
    environment:
      # Bundled database: internal service name by default. .env wins for an
      # external/managed database — see the three modes in .env.example.
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      # Public URL comes from .env (interpolated by compose), localhost default.
      APP_URL: ${APP_URL:-http://localhost:8080}
      # The entrypoint only runs migrations for the web role (octane command).
      RUN_MIGRATIONS: "true"
    volumes:
      - ./storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
        # Optional: with COMPOSE_PROFILES unset (external database), the
        # bundled postgres service is absent and the app starts without it.
        required: false
    healthcheck:
      test: ["CMD-SHELL", "php artisan octane:status || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  worker:
    image: ghcr.io/hadrien-shifumi/taskr:${TASKR_VERSION:-latest}
    pull_policy: always
    build:
      context: .
    container_name: taskr-worker
    # Anything other than the octane command is treated as a worker by the entrypoint.
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--max-time=3600"]
    env_file: .env
    environment:
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      APP_URL: ${APP_URL:-http://localhost:8080}
    volumes:
      - ./storage:/app/storage
    depends_on:
      app:
        # The web role runs the migrations; the worker starts once the app is up.
        condition: service_healthy
    # The image healthcheck targets Octane, which only runs in the web role.
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'queue:work' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  postgres:
    # Bundled database, active via COMPOSE_PROFILES=bundled-db (.env.example
    # ships it enabled). Comment that line out to use an external database —
    # see "Base de données externe" in the README.
    profiles: ["bundled-db"]
    image: pgvector/pgvector:pg18
    container_name: taskr-postgres
    ports:
      # 5433 on the host, loopback only so the database is never exposed
      # publicly, matching DB_PORT in .env, so host-run artisan commands
      # (php artisan test, migrate, tinker) hit the same database.
      - "127.0.0.1:5433:5432"
    environment:
      # Interpolated from .env so the app and the database always agree. Only
      # used when the data volume is initialized from scratch.
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-root}
      POSTGRES_DB: ${DB_DATABASE:-taskr}
    volumes:
      # pg18 images expect the mount at /var/lib/postgresql (data lives in a
      # major-version subdirectory), not /var/lib/postgresql/data.
      - taskr-pgdata:/var/lib/postgresql
      # Runs only when the data volume is initialized from scratch.
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/10-pgvector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_DATABASE:-taskr}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  taskr-pgdata:
