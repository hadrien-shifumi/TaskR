# Vibe hooks — TDD enforcement (see .vibe/skills/tdd/SKILL.md for the workflow).
# Reloaded at the next Vibe launch.

# Refuses E2E (Browser suite) while the dev loop is red or stale:
# E2E is the final gate, never part of the red/green loop.
[[hooks]]
name = "tdd-e2e-gate"
type = "pre_tool"
match = "bash"
command = "php .vibe/hooks/tdd-guard.php"
timeout = 15.0
description = "Blocks composer test:e2e / Browser suite runs while Unit+Feature are red or stale."

# Runs PHPUnit after every edit/write on tests/ or source code and appends a
# red/green verdict to the tool result; watches manual test runs through bash.
# Informational only — it never blocks an edit.
[[hooks]]
name = "tdd-guard"
type = "post_tool"
match = "re:.*(edit|write|bash).*"
command = "php .vibe/hooks/tdd-guard.php"
timeout = 120.0
description = "Runs the covering PHPUnit scope after code/test edits and appends the verdict."

# Refuses to end an assistant turn while the suites are red or a run is pending.
[[hooks]]
name = "tdd-gate"
type = "post_agent"
command = "php .vibe/hooks/tdd-gate.php"
timeout = 15.0
description = "Keeps the agent in the red/green loop until Unit+Feature are green and fresh."

# TaskR issue lifecycle enforcement (see .vibe/skills/taskr-issue-dev/SKILL.md
# for the workflow). Reloaded at the next Vibe launch.

# While an issue workflow is active: blocks source edits before the plan
# comment, unmarked TaskR comments, and time entries before the done comment.
[[hooks]]
name = "issue-dev-guard"
type = "pre_tool"
match = "re:.*(edit|write|bash|typescript).*"
command = "php .vibe/hooks/issue-dev.php"
timeout = 15.0
description = "Blocks out-of-order steps in the TaskR issue lifecycle (edits before plan, unmarked comments, premature time entries)."

# Records workflow progress from the observed tool calls (knowledge search,
# code exploration, plan/done comments, time entries, knowledge updates) and
# nudges to declare the workflow when the TaskR connector is used untracked.
[[hooks]]
name = "issue-dev-recorder"
type = "post_tool"
match = "re:.*(edit|write|bash|read|typescript).*"
command = "php .vibe/hooks/issue-dev.php"
timeout = 15.0
description = "Records TaskR issue lifecycle progress observed in tool calls."

# Refuses to end an assistant turn while a declared TaskR issue workflow is
# incomplete (research, plan comment, done comment, time entry, knowledge review).
[[hooks]]
name = "issue-dev-gate"
type = "post_agent"
command = "php .vibe/hooks/issue-dev.php"
timeout = 15.0
description = "Keeps the agent on the TaskR issue lifecycle until plan, done comment, time entry and knowledge review are complete."
