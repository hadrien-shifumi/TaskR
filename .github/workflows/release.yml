# Publishes the production image to GHCR on every version tag (v*).
#
#   echo 1.2.0 > VERSION && git add VERSION && git commit -m "Bump VERSION to 1.2.0"
#   git tag v1.2.0 && git push && git push --tags
#     → ghcr.io/hadrien-shifumi/taskr:1.2.0
#     → ghcr.io/hadrien-shifumi/taskr:1.2
#     → ghcr.io/hadrien-shifumi/taskr:1
#     → ghcr.io/hadrien-shifumi/taskr:latest
#
# The VERSION file must be bumped in the same commit as the tag: it ships in
# the composer create-project archive and `php artisan taskr:update` reads it
# to detect the installed version. This workflow fails fast if they drift.
#
# Nothing is pushed before the image has started: the amd64 build is loaded
# and smoke-tested first (.github/scripts/smoke-test-image.sh), and only then
# is the multi-arch image built and published. v0.4.0 shipped an image that
# could not start, because images were only ever pushed.
#
# The multi-arch image is built for linux/amd64 and linux/arm64 (arm64 runs
# under QEMU, which makes releases slower but keeps this workflow simple). The
# smoke test covers amd64: the arm64 half is not booted here. The docker.yml
# workflow runs the same checks on pull requests.

name: Release

on:
  push:
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  SMOKE_IMAGE: taskr:smoke

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v5

      - name: Verify the VERSION file matches the pushed tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(cat VERSION)"
          if [ "$tag" != "$version" ]; then
            echo "VERSION file ($version) does not match the pushed tag ($tag) — bump VERSION before tagging. The file ships in the composer create-project archive and powers \`php artisan taskr:update\`." >&2
            exit 1
          fi

      - name: Set up QEMU (arm64 emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Stated, not left to detection or inheritance: the licenses label
          # would wait on GitHub's own license detection, and the vendor label
          # would be the base image's (FrankenPHP's author).
          labels: |
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.vendor=Shifumi
          annotations: |
            manifest:org.opencontainers.image.licenses=MIT
            manifest:org.opencontainers.image.vendor=Shifumi
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            # `latest` follows stable releases only (pre-release tags contain a dash).
            type=raw,value=latest,enable=${{ !contains(github.ref, '-') }}

      - name: Build the amd64 image for the smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          # Loaded into the daemon so that the smoke test can run it.
          load: true
          tags: ${{ env.SMOKE_IMAGE }}
          push: false
          # One scope shared with docker.yml: the release reuses the layers
          # its pull request already built.
          cache-from: type=gha,scope=image
          cache-to: type=gha,scope=image,mode=max

      - name: Smoke test (nothing is pushed before the image has started)
        run: .github/scripts/smoke-test-image.sh ${{ env.SMOKE_IMAGE }}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha,scope=image
          cache-to: type=gha,scope=image,mode=max
