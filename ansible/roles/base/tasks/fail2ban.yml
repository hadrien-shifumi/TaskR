---
- name: Install fail2ban jail for sshd
  ansible.builtin.copy:
    content: |
      [sshd]
      enabled = true
      port = {{ base_ssh_port }}
      maxretry = 5
      findtime = 10m
      bantime = 1h
      backend = systemd
    dest: /etc/fail2ban/jail.d/sshd.local
    mode: "0644"
  notify: Restart fail2ban
