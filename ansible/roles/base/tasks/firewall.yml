---
- name: Allow SSH through the firewall before enabling it
  community.general.ufw:
    rule: allow
    port: "{{ base_ssh_port }}"
    proto: tcp
    comment: SSH

- name: Allow extra ports (HTTP/HTTPS…)
  community.general.ufw:
    rule: "{{ item.rule | default('allow') }}"
    port: "{{ item.port }}"
    proto: "{{ item.proto | default('tcp') }}"
    comment: "{{ item.comment | default(omit) }}"
  loop: "{{ base_firewall_allow }}"

- name: Enable UFW with default deny incoming / allow outgoing
  community.general.ufw:
    state: enabled
    policy: deny
    direction: incoming

- name: Set outgoing policy to allow
  community.general.ufw:
    policy: allow
    direction: outgoing

- name: Enable UFW logging
  community.general.ufw:
    logging: "on"
